name: Verify reservation UI hierarchy once
on:
  push:
    branches:
      - feat/frontend-ui-polish

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
      - name: Remove one-time verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-polish-reservation-verify-once.yml
          git commit -m "chore: 일회성 프론트엔드 검증 워크플로 정리"
          git push origin HEAD:feat/frontend-ui-polish
