name: Verify reservation concurrency (branch)

on:
  push:
    branches:
      - fix/reservation-concurrency

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: labgear_test
          MYSQL_USER: labgear_test
          MYSQL_PASSWORD: labgear-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      LABGEAR_TEST_DB_PASSWORD: labgear-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run integration tests on MySQL
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --no-daemon --console=plain
