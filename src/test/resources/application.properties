# Integration tests use a separate MySQL database and restricted account.
# A missing password must fail test startup instead of using development credentials.
spring.application.name=labgear-test
spring.datasource.url=jdbc:mysql://localhost:3306/labgear_test
spring.datasource.username=labgear_test
spring.datasource.password=${LABGEAR_TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
